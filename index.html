<!DOCTYPE html>
<html>
<head>
    <title>Star Wars</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="split-screen">
        <div class="left" id="left-side">
            <a href="#left-full" class="lightsaber">
                <div class="light"></div>
                <div class="top"></div>
                <div class="middle"></div>
                <div class="bottom"></div>
            </a>
        </div>

        
        <div class="right" id="right-side">
            <a href="#right-full" class="lightsaber">
                <div class="light"></div>
                <div class="top"></div>
                <div class="middle"></div>
                <div class="bottom"></div>
            </a>
        </div>
    </div>

    
    <div class="full-screen" id="left-full">
        <div class="login-form">
            <h2>Login as Jedi</h2>
            <input id="username_input" type="text" placeholder="Username">
            <input id="password_input" type="password" placeholder="Password">
            <button class="login_button" onclick="login();">Login</button>
            <a href="#" class="go-back">Go Back</a>
        </div>
    </div>

    
    <div class="full-screen" id="right-full">
        <div class="login-form">
            <h2>Login as Sith</h2>
            <input id="username_input" type="text" placeholder="Username">
            <input id="password_input" type="password" placeholder="Password">
            <button class="login_button" onclick="login();">Login</button>
            <a href="#" class="go-back">Go Back</a>
        </div>
    </div>
    <script src="log_in.js"></script>
</body>
</html>
