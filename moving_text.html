<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Star Wars Login</title>
  <link rel="stylesheet" href="moving_text.css">
</head>
<body>
  <div class="starwars-demo">
    <img src="star.svg" alt="Star" class="star">
    <img src="wars.svg" alt="Wars" class="wars">
  </div>

  <div class="lightsabers">
    <div class="lightsaber_left">
      <div class="light"></div>
      <div class="top"></div>
      <div class="middle"></div>
      <div class="bottom"></div>
    </div>
    <div class="lightsaber_right">
      <div class="light"></div>
      <div class="top"></div>
      <div class="middle"></div>
      <div class="bottom"></div>
    </div>
  </div>

  <div class="login-form" id="loginForm">
    <form id="loginFormElement">
      <input type="text" id="username" placeholder="Username" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
  </div>

  <script src="moving_text.js"></script>
  <script>
    document.getElementById("loginFormElement").addEventListener("submit", function(event) {
      event.preventDefault();  // Prevent the form from submitting traditionally
      
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      // Check if the username and password are both "admin"
      if (username === "admin" && password === "admin") {
        // Redirect to the class page after successful login
        window.location.href = "table.html";
      } else {
        alert("Incorrect username or password.");
      }
    });
  </script>
</body>
</html>
